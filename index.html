<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="/assets/img/favicon.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="/assets/css/remixicon/remixicon.css" />
    <link rel="stylesheet" href="/assets/css/styles.css" />

    <title>Steakhouse Restaurant | Ali Rezaei</title>
  </head>
  <body>
    <!-- HEADER & NAV -->
    <header id="header" class="header">
      <nav class="nav container">
        <a href="/index.html" class="nav__logo">Steakhouse</a>

        <div class="nav__menu" id="nav-menu">
          <ul class="nav__list">
            <li>
              <a href="#home" class="nav__link">Home</a>
            </li>
            <li>
              <a href="#about" class="nav__link">About Us</a>
            </li>
            <li>
              <a href="#menu" class="nav__link">Menu</a>
            </li>
            <li>
              <a href="#events" class="nav__link">Events</a>
            </li>
            <li>
              <a href="#contact" class="nav__link">Contact</a>
            </li>
            <li>
              <a href="#reservation" class="nav__link">Reservations</a>
            </li>
          </ul>

          <!-- Close -->
          <button id="nav-close" class="nav__close" type="button">
            <i class="ri-close-large-line" aria-label="Close menu"></i>
          </button>
        </div>

        <!-- Toggle -->
        <button class="nav__toggle" id="nav-toggle">
          <i class="ri-menu-line" aria-label="Toggle menu"></i>
        </button>
      </nav>
    </header>
    <!--==================== MAIN ====================-->
    <main class="main">
      <!--==================== HOME SECTION ====================-->
      <section class="home section" id="home">
        <div class="home__container container grid">
          <div class="home__data">
            <h1 class="home__title">
              A Premium <br />
              And Authentic <br />
              Steakhouse
            </h1>

            <a href="#" class="home__button button">Book a Table</a>
          </div>
          <div class="home__images">
            <img src="/assets/img/home-salt.png" alt="" class="home__salt-2" />
            <img src="/assets/img/home-salt.png" alt="" class="home__salt-1" />
            <img
              src="/assets/img/home-pepper.png"
              alt=""
              class="home__pepper"
            />
            <img
              src="/assets/img/home-tomato.png"
              alt=""
              class="home__tomato"
            />
            <img
              src="/assets/img/home-rosemary-1.png"
              alt=""
              class="home__rosemary-1"
            />
            <img src="/assets/img/home-onion.png" alt="" class="home__onion" />
            <img src="/assets/img/home-spoon.png" alt="" class="home__spoon" />
            <img
              src="/assets/img/home-rosemary-2.png"
              alt=""
              class="home__rosemary-2"
            />
            <img
              src="/assets/img/home-frying-pan.png"
              alt=""
              class="home__fryingpan"
            />
          </div>
        </div>
      </section>

      <!--==================== ABOUT SECTION ====================-->
      <section class="about section" id="about"></section>

      <!--==================== MENU SECTION ====================-->
      <section class="menu section" id="menu"></section>

      <!--==================== EVENTS SECTION ====================-->
      <section class="events section" id="events"></section>

      <!--==================== INGREDIENTS SECTION ====================-->
      <section class="ingredients section"></section>

      <!--==================== CONTACT SECTION ====================-->
      <section class="contact section" id="contact"></section>

      <!--==================== RESERVATION SECTION ====================-->
      <section class="reservation section" id="reservation"></section>
    </main>

    <!--==================== FOOTER ====================-->
    <footer class="footer"></footer>
    <script src="/js/main.js"></script>
  </body>
</html>
